<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intro - AMATS City Scandal</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;700&family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=7">
<style>
.ic{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin:14px 0 6px}
.ic .btn{margin:0;min-width:130px;font-size:18px;padding:12px 22px}
.ichip{text-align:center;padding:26px 10px}.ichip img{max-width:min(420px,80%);height:auto}.ichip h1{margin:10px 0 4px}
.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:8px 0}.dots i{width:10px;height:10px;border-radius:50%;background:#2c4357}.dots i.on{background:var(--amber,#e0c98a)}
.hint{text-align:center;opacity:.7;font-size:13px}
</style></head>
<body data-page="intro"><div class="term"><div class="term-top"></div><div class="term-body"><div id="app"></div></div></div>
<script src="story.js?v=7"></script>
<script>
/* Offline intro for the teacher screen. No Sheet, no polling, no PIN: the slide number lives only in this page. */
const app=document.getElementById('app'),N=SCENES.length;
let i=-1; // -1 = start screen, 0..N-1 = slides, N = end screen
const fromHash=()=>{const h=location.hash.slice(1);if(h==='end')return N;const n=parseInt(h,10);return n>=1&&n<=N?n-1:-1;};
const pre=k=>{const s=SCENES[k];if(!s)return;[s.bg].concat(s.c.map(x=>'char_'+x[0])).forEach(n=>{new Image().src='assets/'+n+'.png';});};
function show(k){
 i=Math.max(-1,Math.min(N,k));
 try{history.replaceState(null,'',i<0?'#':'#'+(i>=N?'end':i+1));}catch(e){}
 let body;
 if(i<0)body=`<div class="ichip card"><img src="assets/title_logo.png" alt="" onerror="this.style.display='none'"><h1>AMATS City Scandal</h1><p>News Item Detective &middot; Introduction</p><div class="ic"><button class="btn" id="go">Start</button></div><p class="hint">Next: &rarr; or Space &nbsp;&middot;&nbsp; Back: &larr; &nbsp;&middot;&nbsp; Fullscreen: F</p></div>`;
 else if(i>=N)body=`<div class="ichip card"><h1>The case is open</h1><p>Find the QR codes on the map poster, scan a station and start investigating.</p><div class="ic"><button class="btn alt" id="bk">Back</button><button class="btn" id="rs">Restart intro</button></div></div>`;
 else body=vnHTML(SCENES[i],'',i+1,N)+`<div class="ic"><button class="btn alt" id="bk">Back</button><button class="btn" id="nx">${i===N-1?'Finish':'Next'}</button></div><div class="dots">${SCENES.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div>`;
 app.innerHTML=`<div class="wrap">${body}</div>`;
 const on=(id,f)=>{const b=document.getElementById(id);if(b)b.onclick=f;};
 on('go',()=>show(0));on('nx',()=>show(i+1));on('bk',()=>show(i-1));on('rs',()=>show(-1));
 pre(i+1);
}
addEventListener('keydown',e=>{
 if(e.target.tagName==='BUTTON'&&(e.key==='Enter'||e.key===' '))return; // a focused button handles its own click
 if(['ArrowRight',' ','Enter','PageDown'].includes(e.key)){e.preventDefault();show(i+1);}
 else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();show(i-1);}
 else if(e.key==='Home'){show(-1);}
 else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}
});
show(fromHash());
</script></body></html>
